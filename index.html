<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tunefind</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--ink:#f3f1ff;--muted:#9aa0b4;--acc:#8f7bff;--hot:#ff6b8b;--line:#2a2f3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:22px;height:22px;fill:currentColor;display:block}
.app{max-width:640px;margin:auto;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0)) 16px 8px}
h1{margin:0;font-size:1.4rem;letter-spacing:-.02em}
h1 i{color:var(--acc);font-style:normal}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon:active{background:var(--card)}

/* player */
.stage{display:none;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px 12px}
.stage.on{display:block}
.vid{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.vid iframe{width:100%;height:100%}
.row1{display:flex;gap:12px;align-items:center;margin-top:10px}
.meta{flex:1;min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--muted)}
.ctl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.ctl .icon{color:var(--ink)}
.play{width:52px;height:52px;background:var(--acc);color:#14102b!important}
.play svg{width:26px;height:26px}
.bar{display:flex;gap:8px;align-items:center;font-size:.75rem;color:var(--muted);margin-top:4px}
input[type=range]{flex:1;accent-color:var(--acc);height:24px}
.stage.mini{display:flex;gap:12px;align-items:center;padding:8px 16px}
.stage.mini .vid{width:96px;flex:none;border-radius:10px}
.stage.mini .row1,.stage.mini .ctl,.stage.mini .bar{display:none}
.stage.mini .miniinfo{display:flex}
.miniinfo{display:none;flex:1;min-width:0;align-items:center;gap:6px}
.miniinfo .meta{flex:1}

/* search */
.search{position:relative;margin:12px 16px 8px}
.search input{width:100%;padding:14px 44px 14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search button{position:absolute;right:6px;top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.chips button{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);color:var(--muted);font-size:.85rem;border:1px solid var(--line)}
.tabs{display:flex;gap:4px;margin:12px 16px 8px;padding:4px;background:var(--card);border-radius:14px}
.tabs button{flex:1;padding:8px;border-radius:10px;color:var(--muted);font-size:.9rem}
.tabs button[aria-selected=true]{background:var(--card2);color:var(--ink)}
.tabs span{color:var(--acc)}

/* lists */
ul{list-style:none;margin:0;padding:0 16px 96px;display:grid;gap:8px}
li{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--card);border:1px solid transparent;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
li.now{border-color:var(--acc)}
li img{width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none}
.t{flex:1;min-width:0;text-align:left}
.t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:.92rem}
.t small{color:var(--muted)}
li.now small{color:var(--acc)}
.acts{display:flex;flex-direction:column}
.acts .icon{width:34px;height:34px}
.acts .icon svg{width:20px;height:20px}
.fav{color:var(--hot)!important}
.empty,.status{color:var(--muted);padding:24px 16px;text-align:center}
.err{color:#ff8a8a}
.skel{height:70px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* key sheet + toast */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:#000a}
dialog p{color:var(--muted);font-size:.9rem;margin:0 0 10px}
dialog input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btns button{padding:10px 16px;border-radius:12px;background:var(--card2)}
.btns .go{background:var(--acc);color:#14102b;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:var(--ink);color:#14102b;padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Tune<i>find</i></h1>
    <button class="icon" id="keyBtn" aria-label="API key settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 5v-2l-2.2-.5a6.9 6.9 0 00-.8-1.9l1.2-1.9-1.4-1.4-1.9 1.2a6.9 6.9 0 00-1.9-.8L13 3h-2l-.5 2.2a6.9 6.9 0 00-1.9.8L6.7 4.8 5.3 6.2l1.2 1.9a6.9 6.9 0 00-.8 1.9L3.5 11v2l2.2.5c.2.7.5 1.3.8 1.9l-1.2 1.9 1.4 1.4 1.9-1.2c.6.3 1.2.6 1.9.8L11 21h2l.5-2.2c.7-.2 1.3-.5 1.9-.8l1.9 1.2 1.4-1.4-1.2-1.9c.3-.6.6-1.2.8-1.9L21 13z"/></svg></button>
  </header>

  <section class="stage" id="stage" aria-label="Player">
    <div class="vid" id="vid"><div id="yt"></div></div>
    <div class="row1">
      <div class="meta"><b id="nTitle"></b><small id="nChan"></small></div>
      <button class="icon" id="favBtn" aria-label="Save song"></button>
      <button class="icon" id="miniBtn" aria-label="Shrink player"><svg viewBox="0 0 24 24"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    </div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    <div class="ctl">
      <button class="icon" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="icon play" id="pp" aria-label="Play or pause"></button>
      <button class="icon" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
    </div>
    <div class="miniinfo"><div class="meta"><b id="mTitle"></b><small id="mChan"></small></div>
      <button class="icon" id="mpp" aria-label="Play or pause"></button>
      <button class="icon" id="mnext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
      <button class="icon" id="bigBtn" aria-label="Expand player"><svg viewBox="0 0 24 24"><path d="M7.4 15.4L12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg></button></div>
  </section>

  <form class="search" id="f" role="search">
    <input id="q" type="search" placeholder="Search a song or artist" autocomplete="off" enterkeyhint="search" aria-label="Search">
    <button class="icon" id="clr" type="button" aria-label="Clear" hidden><svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
  </form>
  <div class="chips" id="chips"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="results" aria-selected="true">Results</button>
    <button role="tab" data-tab="queue" aria-selected="false">Queue <span id="qc"></span></button>
    <button role="tab" data-tab="saved" aria-selected="false">Saved <span id="sc"></span></button>
  </div>
  <div id="status" class="status" hidden></div>
  <ul id="list"></ul>
</div>

<dialog id="keyDlg">
  <p>Paste your YouTube Data API v3 key. It stays on this phone.</p>
  <input id="keyIn" placeholder="AIza..." autocomplete="off">
  <div class="btns"><button id="keyCancel">Cancel</button><button class="go" id="keySave">Save</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const I = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  add:'<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 21l-1.5-1.3C5.4 15.4 2 12.4 2 8.5A4.5 4.5 0 016.5 4c1.7 0 3.4.8 4.5 2.1A6 6 0 0115.5 4 4.5 4.5 0 0120 8.5c0 3.900-3.400 6.900-8.500 11.200z"/></svg>',
  heartO:'<svg viewBox="0 0 24 24"><path d="M16.500 3c-1.700 0-3.400.8-4.500 2.100A6 6 0 007.500 3 5.500 5.500 0 002 8.500c0 3.800 3.400 6.900 8.600 11.500L12 21.300l1.400-1.300C18.600 15.400 22 12.300 22 8.500A5.500 5.500 0 0016.500 3zM12.100 18.600l-.1.100-.1-.1C7.100 14.300 4 11.500 4 8.500 4 6.600 5.600 5 7.500 5c1.500 0 3 1 3.500 2.400h2C13.500 6 15 5 16.500 5 18.400 5 20 6.600 20 8.500c0 3-3.100 5.800-7.900 10.100z"/></svg>'
};

const S = {
  results:[], queue:[], saved:LS.get('saved',[]), recent:LS.get('recent',[]),
  ctx:[], cur:null, tab:'results', playing:false, mini:false, loading:false, error:''
};
let player = null, pending = null;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decode = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const fmt = t => { t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
const isSaved = id => S.saved.some(s => s.id === id);
let tt;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1800); }

/* ---------- player ---------- */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('yt', {
    width:'100%', height:'100%',
    playerVars:{ playsinline:1, rel:0, autoplay:1, modestbranding:1 },
    events:{
      onReady(){ if (pending){ player.loadVideoById(pending); pending = null; } },
      onStateChange(e){
        if (e.data === YT.PlayerState.ENDED) next();
        S.playing = e.data === YT.PlayerState.PLAYING;
        paintPlay();
      },
      onError(){ toast('Can’t play this one in the app. Skipping.'); next(); }
    }
  });
}

function play(song, ctx){
  S.cur = song; if (ctx) S.ctx = ctx;
  $('#stage').classList.add('on');
  if (player && player.loadVideoById) player.loadVideoById(song.id); else pending = song.id;
  paintNow(); render();
  if ('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title:song.title, artist:song.channel, artwork:[{src:song.thumb}] });
    navigator.mediaSession.setActionHandler('play', () => player.playVideo());
    navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
    navigator.mediaSession.setActionHandler('nexttrack', next);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  }
}
function next(){
  if (S.queue.length){ const s = S.queue.shift(); play(s); updateCounts(); return; }
  const i = S.ctx.findIndex(s => s.id === S.cur?.id);
  if (i >= 0 && i < S.ctx.length - 1) play(S.ctx[i+1]);
  else { S.playing = false; paintPlay(); toast('End of list'); }
}
function prev(){
  if (player && player.getCurrentTime && player.getCurrentTime() > 4) return player.seekTo(0);
  const i = S.ctx.findIndex(s => s.id === S.cur?.id);
  if (i > 0) play(S.ctx[i-1]);
}
function toggle(){ if (!player) return; S.playing ? player.pauseVideo() : player.playVideo(); }

function paintPlay(){
  const h = S.playing ? I.pause : I.play;
  $('#pp').innerHTML = h; $('#mpp').innerHTML = h;
}
function paintNow(){
  const s = S.cur; if (!s) return;
  ['nTitle','mTitle'].forEach(id => $('#'+id).textContent = s.title);
  ['nChan','mChan'].forEach(id => $('#'+id).textContent = s.channel);
  $('#favBtn').innerHTML = isSaved(s.id) ? I.heart : I.heartO;
  $('#favBtn').classList.toggle('fav', isSaved(s.id));
  paintPlay();
}
setInterval(() => {
  if (!player || !player.getCurrentTime || !S.cur) return;
  const c = player.getCurrentTime(), d = player.getDuration();
  if (!d) return;
  $('#cur').textContent = fmt(c); $('#dur').textContent = fmt(d);
  const sk = $('#seek'); if (!sk.matches(':active')) sk.value = (c / d) * 100;
}, 500);
$('#seek').addEventListener('input', e => { const d = player.getDuration(); player.seekTo(d * e.target.value / 100, true); });

/* ---------- search ---------- */
async function search(term){
  const key = LS.get('key', '');
  if (!key){ $('#keyDlg').showModal(); throw new Error('Add your YouTube API key to search.'); }
  const p = new URLSearchParams({ part:'snippet', type:'video', videoCategoryId:'10', videoEmbeddable:'true', maxResults:'20', q:term, key });
  const r = await fetch('https://www.googleapis.com/youtube/v3/search?' + p);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || 'Search failed. Try again.');
  return d.items.map(i => ({ id:i.id.videoId, title:decode(i.snippet.title), channel:decode(i.snippet.channelTitle), thumb:i.snippet.thumbnails.medium.url }));
}
async function runSearch(term){
  term = term.trim(); if (!term) return;
  $('#q').value = term; $('#clr').hidden = false; $('#q').blur();
  S.recent = [term, ...S.recent.filter(x => x.toLowerCase() !== term.toLowerCase())].slice(0, 8);
  LS.set('recent', S.recent); renderChips();
  S.tab = 'results'; S.loading = true; S.error = ''; render();
  try { S.results = await search(term); }
  catch (e){ S.results = []; S.error = e.message; }
  S.loading = false; render();
}
$('#f').addEventListener('submit', e => { e.preventDefault(); runSearch($('#q').value); });
$('#q').addEventListener('input', () => $('#clr').hidden = !$('#q').value);
$('#clr').onclick = () => { $('#q').value = ''; $('#clr').hidden = true; $('#q').focus(); };

/* ---------- render ---------- */
function renderChips(){
  $('#chips').innerHTML = S.recent.map(t => `<button data-q="${esc(t)}">${esc(t)}</button>`).join('');
}
function updateCounts(){
  $('#qc').textContent = S.queue.length || ''; $('#sc').textContent = S.saved.length || '';
}
function render(){
  updateCounts();
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  const st = $('#status'), ul = $('#list');
  st.hidden = true; st.className = 'status';
  let items = S[S.tab];
  if (S.tab === 'results' && S.loading){
    ul.innerHTML = '<div class="skel"></div>'.repeat(5); return;
  }
  if (!items.length){
    ul.innerHTML = ''; st.hidden = false;
    if (S.tab === 'results'){
      if (S.error){ st.classList.add('err'); st.textContent = S.error; }
      else st.textContent = 'Search for a song to start listening.';
    } else if (S.tab === 'queue') st.textContent = 'Queue is empty. Tap + on a song to line it up.';
    else st.textContent = 'No saved songs yet. Tap the heart on a song to keep it here.';
    return;
  }
  ul.innerHTML = items.map((s, i) => {
    const now = S.cur?.id === s.id;
    const acts = S.tab === 'queue'
      ? `<button class="icon" data-a="rm" aria-label="Remove from queue">${I.del}</button>`
      : `<button class="icon" data-a="q" aria-label="Add to queue">${I.add}</button>
         <button class="icon ${isSaved(s.id) ? 'fav' : ''}" data-a="fav" aria-label="Save">${isSaved(s.id) ? I.heart : I.heartO}</button>`;
    return `<li class="${now ? 'now' : ''}" data-i="${i}"><img src="${s.thumb}" alt="" loading="lazy">
      <button class="t" data-a="play"><b>${esc(s.title)}</b><small>${now ? 'Now playing' : esc(s.channel)}</small></button>
      <div class="acts">${acts}</div></li>`;
  }).join('');
}
$('#list').addEventListener('click', e => {
  const btn = e.target.closest('[data-a]'); if (!btn) return;
  const i = +btn.closest('li').dataset.i, list = S[S.tab], s = list[i], a = btn.dataset.a;
  if (a === 'play') { if (S.tab === 'queue'){ S.queue.splice(i,1); play(s); } else play(s, list); }
  if (a === 'q'){ S.queue.push(s); toast('Added to queue'); }
  if (a === 'rm'){ S.queue.splice(i,1); }
  if (a === 'fav') toggleSave(s);
  render();
});
function toggleSave(s){
  if (isSaved(s.id)){ S.saved = S.saved.filter(x => x.id !== s.id); toast('Removed from saved'); }
  else { S.saved.unshift(s); toast('Saved'); }
  LS.set('saved', S.saved); paintNow();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (b){ S.tab = b.dataset.tab; render(); }
});
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) runSearch(b.dataset.q); });

/* ---------- controls ---------- */
$('#pp').onclick = toggle; $('#mpp').onclick = toggle;
$('#next').onclick = next; $('#mnext').onclick = next; $('#prev').onclick = prev;
$('#favBtn').onclick = () => { if (S.cur){ toggleSave(S.cur); render(); } };
const setMini = m => { S.mini = m; $('#stage').classList.toggle('mini', m); };
$('#miniBtn').onclick = () => setMini(true); $('#bigBtn').onclick = () => setMini(false);

/* ---------- API key dialog ---------- */
$('#keyBtn').onclick = () => { $('#keyIn').value = LS.get('key', ''); $('#keyDlg').showModal(); };
$('#keyCancel').onclick = () => $('#keyDlg').close();
$('#keySave').onclick = () => {
  const k = $('#keyIn').value.trim();
  if (k){ LS.set('key', k); $('#keyDlg').close(); toast('Key saved'); if ($('#q').value) runSearch($('#q').value); }
};

/* ---------- boot ---------- */
renderChips(); paintPlay(); render();
if (!LS.get('key', '')) setTimeout(() => $('#keyDlg').showModal(), 400);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
